        const CARD_DEFAULT_CATS = ['Gasolina', 'Ração', 'Assinatura', 'Presente', 'Outros'];
        const pad2 = n => String(n).padStart(2, '0');
        function ymAdd(key, n) { const [y, m] = key.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; }
        function fmtYM(key) { const [y, m] = key.split('-').map(Number); const s = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }
        function cardById(id) { return appData.cartao.cards.find(c => c.id === id); }
        // Fatura identificada pelo mês de VENCIMENTO. Compra depois do dia de fechamento cai na fatura seguinte.
        function cardInvoiceKey(card, dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const close = Number(card.closingDay) || 31, due = Number(card.dueDay) || close;
            let cm = m - 1; if (d > close) cm++;
            const dm = cm + (due > close ? 0 : 1);
            const dt = new Date(y, dm, 1);
            return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}`;
        }
        function cardDueDate(card, key) {
            const [y, m] = key.split('-').map(Number);
            const last = new Date(y, m, 0).getDate();
            return `${key}-${pad2(Math.min(Number(card.dueDay) || last, last))}`;
        }
        function cardEntriesFor(cardId, key) { return appData.cartao.entries.filter(e => e.cardId === cardId && e.invoice === key); }
        function cardInvoiceTotal(cardId, key) { return cardEntriesFor(cardId, key).reduce((s, e) => s + (Number(e.amount) || 0), 0); }
        function cardInvoiceTx(cardId, key) { return appData.financeiro.transactions.find(t => t.cardInvoice && t.cardInvoice.cardId === cardId && t.cardInvoice.inv === key); }

        // Leva para Finanças somente "Cartão de Crédito" + valor final de cada fatura
        function syncCardInvoices() {
            const C = appData.cartao; if (!C) return;
            const sums = {};
            C.entries.forEach(e => {
                if (!e.invoice || !C.cards.some(c => c.id === e.cardId)) return;
                const k = e.cardId + '|' + e.invoice;
                sums[k] = (sums[k] || 0) + (Number(e.amount) || 0);
            });
            const seen = new Set(), keep = [];
            const upd = (t, cardId, inv) => {
                const card = cardById(cardId);
                t.type = 'despesa'; t.category = 'Cartão de Crédito';
                t.desc = 'Cartão de Crédito' + (C.cards.length > 1 ? ' — ' + card.name : '');
                t.amount = Math.max(0, sums[cardId + '|' + inv]).toFixed(2); // crédito maior que a fatura não gera despesa negativa
                t.date = cardDueDate(card, inv);
            };
            appData.financeiro.transactions.forEach(t => {
                if (!t.cardInvoice) { keep.push(t); return; }
                const k = t.cardInvoice.cardId + '|' + t.cardInvoice.inv;
                if (sums[k] !== undefined && !seen.has(k)) { upd(t, t.cardInvoice.cardId, t.cardInvoice.inv); seen.add(k); keep.push(t); }
                else (t.attachments || []).forEach(a => deleteStoredFile(a.id));
            });
            Object.keys(sums).forEach(k => {
                if (seen.has(k)) return;
                const [cardId, inv] = k.split('|');
                const t = { id: uid(), status: 'pendente', attachments: [], cardInvoice: { cardId, inv } };
                upd(t, cardId, inv); keep.push(t);
            });
            appData.financeiro.transactions = keep;
        }
        function cardCommit(msg) { syncCardInvoices(); saveAppData(); closeModal(); renderCurrentTabContent(); if (msg) showToast(msg, 'success'); }

        function guessCardCategory(name) {
            const n = normKey(name);
            const rules = [['Gasolina', /posto|shell|ipiranga|petrobras|combust|gasolina|\bale\b/], ['Ração', /rac(ao|ões)|\bpet\b|petz|cobasi|agropec|veterin/], ['Assinatura', /netflix|spotify|disney|prime video|amazon prime|youtube|hbo|max\b|globoplay|apple\.com|google (one|play)|icloud|assinatura|deezer/], ['Presente', /presente|boticario|natura|floricultura|flores/]];
            for (const [cat, re] of rules) if (re.test(n) && appData.cartao.categories.includes(cat)) return cat;

        async function handleCardImportFile(input) {
            const f = input.files[0]; if (!f) return;
            const msg = document.getElementById('ci-msg'); msg.textContent = 'Lendo arquivo…';
            try {
                const ext = f.name.split('.').pop().toLowerCase();
                let raw = [];
                if (ext === 'ofx' || ext === 'qfx') raw = parseOfx(await f.text());
                else if (ext === 'csv' || ext === 'txt') raw = parseCsvFatura(await f.text());
                else if (ext === 'pdf') raw = await parsePdfFatura(f);
                else throw new Error('Formato não suportado.');

        function parseOfx(txt) {
            const out = [], re = /<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi; let m;
            const tag = (s, t) => { const x = s.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return x ? x[1].trim() : ''; };
            while ((m = re.exec(txt))) {
                const dt = tag(m[1], 'DTPOSTED').slice(0, 8), amt = parseFloat(tag(m[1], 'TRNAMT').replace(',', '.'));
                if (dt.length < 8 || isNaN(amt)) continue;
                out.push({ date: `${dt.slice(0, 4)}-${dt.slice(4, 6)}-${dt.slice(6, 8)}`, name: tag(m[1], 'MEMO') || tag(m[1], 'NAME') || 'Lançamento', signed: amt });
            }
            return out;
        }
        function csvSplit(line, sep) {
            const out = []; let cur = '', q = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
                else if (ch === sep && !q) { out.push(cur); cur = ''; }
                else cur += ch;
            }
            out.push(cur); return out.map(s => s.trim());
        }
        function parseCsvFatura(txt) {
            const lines = txt.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
            if (!lines.length) return [];
            const sep = (lines[0].split(';').length > lines[0].split(',').length) ? ';' : ',';
            const head = csvSplit(lines[0], sep).map(normKey);
            const find = (...al) => head.findIndex(h => al.includes(h));
            let iD = find('data', 'date', 'data da compra', 'data lancamento', 'data compra'), iN = find('descricao', 'description', 'title', 'titulo', 'estabelecimento', 'historico', 'lancamento', 'nome', 'name'), iV = find('valor', 'amount', 'valor (r$)', 'value', 'valor r$');
            let start = 1;
            if (iD < 0 || iV < 0) { iD = 0; iN = 1; iV = head.length - 1; start = 0; }
            if (iN < 0) iN = head.findIndex((h, i) => i !== iD && i !== iV);
            const out = [];
            for (let i = start; i < lines.length; i++) {
                const c = csvSplit(lines[i], sep), date = parseDateAny(c[iD]);
                if (!date) continue;
                const raw = String(c[iV] || '').trim(); if (!raw) continue;
                let v = parseAmount(raw); if (/^\(.*\)$/.test(raw)) v = -Math.abs(v);
                out.push({ date, name: c[iN] || 'Lançamento', signed: v });
            }
            return out;
        }
        async function ensurePdfWorker() {
            if (pdfWorkerReady) return;
            if (typeof pdfjsLib === 'undefined') throw new Error('Leitor de PDF indisponível (sem internet?). Use OFX ou CSV.');
            const url = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            try { const t = await (await fetch(url)).text(); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' })); }
            catch (e) { pdfjsLib.GlobalWorkerOptions.workerSrc = url; }
            pdfWorkerReady = true;
        }
        async function parsePdfFatura(file) {
            await ensurePdfWorker();
            const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            const MES = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };
            const today = new Date(), out = [];
            for (let p = 1; p <= pdf.numPages; p++) {
                const tc = await (await pdf.getPage(p)).getTextContent();
                const rows = {};
                tc.items.forEach(it => { if (!it.str.trim()) return; const y = Math.round(it.transform[5] / 3); (rows[y] = rows[y] || []).push(it); });
                Object.keys(rows).sort((a, b) => b - a).forEach(y => {
                    const line = rows[y].sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
                    const dm = line.match(/^(\d{1,2})[\/\s-]((?:\d{1,2})|(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez))(?:[\/\s-](\d{2,4}))?\b/i);
                    if (!dm) return;
                    const am = [...line.matchAll(/(-|−)?\s?(?:R\$\s?)?(\d{1,3}(?:\.\d{3})*,\d{2})(\s?CR)?/g)].pop();
                    if (!am) return;
                    const day = Number(dm[1]); let mon = /^\d+$/.test(dm[2]) ? Number(dm[2]) : MES[dm[2].toLowerCase()];
                    if (!mon || mon > 12 || day > 31) return;
                    let yr = dm[3] ? Number(dm[3].length === 2 ? '20' + dm[3] : dm[3]) : today.getFullYear();
                    if (!dm[3] && (mon - 1) > today.getMonth() + 1) yr--;
                    let name = line.slice(dm[0].length, am.index).replace(/\s+/g, ' ').trim();
                    if (name.length < 2) return;
                    let v = parseAmount(am[2]); if (am[1] || am[3]) v = -v;
                    out.push({ date: `${yr}-${pad2(mon)}-${pad2(day)}`, name, signed: v });
                });
            }
            return out;
        }
        function buildImportRows(raw) {

        const MESES_PT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
        function bdParts(b) { const [y, m, d] = (b.date || '').split('-').map(Number); return { y, m, d }; }
        function bdNext(b) {
            const { m, d } = bdParts(b), t = new Date(); t.setHours(0, 0, 0, 0);
            let dt = new Date(t.getFullYear(), m - 1, d);
            if (dt < t) dt = new Date(t.getFullYear() + 1, m - 1, d);
            return { dt, days: Math.round((dt - t) / 86400000) };

        function bdAge(b) { const { y } = bdParts(b); return (y && y > 1900) ? bdNext(b).dt.getFullYear() - y : null; }
        function bdAvatar(b, size) {

        function bdDateLabel(b) {

                </div>

        }
        function renderMural() { const el = document.getElementById('mural-box'); if (el) el.innerHTML = muralInner(); }

        function fileToThumb(file, max = 240) {
            return new Promise((resolve, reject) => {

                img.onload = () => {
                    const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
                    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Imagem inválida')); };
                img.src = url;

        }

        // =====================================================
        // RELATÓRIOS (XLSX) — exportar / importar
        // =====================================================
        function normKey(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
        function parseDateAny(v) {
            if (v instanceof Date && !isNaN(v)) return localDateStr(new Date(v.getTime() + 12 * 3600 * 1000));
            if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; }
            const s = String(v == null ? '' : v).trim();
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
            if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
            return '';
        }
        function parseAmount(v) {
            if (typeof v === 'number') return v;
            let s = String(v == null ? '' : v).replace(/R\$|\s/g, '');
            if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
            const n = Number(s);
            return isNaN(n) ? 0 : n;
        }
        function rowGet(row, ...aliases) {
            for (const k of Object.keys(row)) { if (aliases.includes(normKey(k))) return row[k]; }
            return '';
        }
        const _fixed = v => (v === '' || v == null || isNaN(Number(v))) ? '' : Number(v);
        const _accName = id => { const a = accById(id); return a ? a.name : ''; };
        function _accFind(name) {
            const k = normKey(name); if (!k) return '';
            const cs = contasData();
            let a = cs.find(x => normKey(x.name) === k) || cs.find(x => normKey(accLabel(x)) === k);
            if (a) return a.id;
            return '';
        }
        const REPORT_DEFS = {
            financas: { label: 'Finanças', sheet: 'Finanças', alias: ['financas', 'financeiro'],

                rows: () => appData.financeiro.transactions.map(t => [t.type === 'receita' ? 'receita' : t.type === 'transferencia' ? 'transferência' : 'despesa', finSt(t) === 'pendente' ? 'pendente' : (t.type === 'receita' ? 'recebido' : 'pago'), t.desc, Number(t.amount), t.category, fmtBR(t.date), _accName(t.accId), _accName(t.toAccId), '']) },
            cartao: { label: 'Cartão de Crédito (lançamentos)', sheet: 'Cartão de Crédito', alias: ['cartao de credito', 'cartao credito', 'cartao', 'fatura', 'lancamentos cartao'],

                rows: () => appData.cartao.entries.map(e => { const c = cardById(e.cardId); const v = Number(e.amount) || 0; return [c ? c.name : '', e.name, Math.abs(v), v < 0 ? 'crédito' : 'compra', fmtBR(e.date), e.invoice || '', e.category || '', e.installment ? `${e.installment.n}/${e.installment.total}` : '', e.obs || '']; }) },
            contatos: { label: 'Contatos', sheet: 'Contatos', alias: ['contatos', 'contato'],

                rows: () => appData.lembretes.map(l => { const r = l.rec || {}; const t = r.type || 'unico'; return [l.title, fmtBR(l.date), l.priority || 'Média', ({ unico: 'único', diario: 'diário', mensal: 'mensal', anual: 'anual', cada: 'a cada X dias', dias: 'dias da semana' })[t] || 'único', t === 'cada' ? (r.every || '') : '', t === 'dias' ? (r.weekdays || []).map(i => LEM_WD[i]).join(', ') : '', l.completed ? 'sim' : 'não']; }) }
        };
        function buildWorkbook(keys, template) {
            const wb = XLSX.utils.book_new();

        function exportReports(keys, template) {

            showToast(template ? 'Modelo baixado!' : 'Relatório exportado!', 'success');

        function importReport(kind, input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f) return;
            if (typeof XLSX === 'undefined') { showToast('Biblioteca de planilhas não carregou (verifique a internet).', 'error'); return; }
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array', cellDates: true });
                    const d = REPORT_DEFS[kind];
                    let name = wb.SheetNames.find(n => d.alias.includes(normKey(n)));
                    if (!name && wb.SheetNames.length === 1) name = wb.SheetNames[0];
                    if (!name) throw new Error(`não achei a aba "${d.sheet}" na planilha`);
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '', raw: true });
                    const res = applyImport(kind, rows);
                    if (kind === 'cartao' && res.added) syncCardInvoices();
                    if (res.added === 0 && res.skipped === 0) { showToast('Nenhuma linha válida encontrada.', 'warning'); return; }
                    saveAppData(); renderCurrentTabContent();
                    showToast(`${d.label}: ${res.added} importados${res.skipped ? `, ${res.skipped} ignorados (repetidos ou incompletos)` : ''}.`, res.added ? 'success' : 'warning');
                } catch (e) { console.error(e); showToast('Erro ao importar: ' + e.message, 'error'); }
            };
            reader.readAsArrayBuffer(f);
        }
        function applyImport(kind, rows) {
            let added = 0, skipped = 0;
            const today = localDateStr();
            const S = v => String(v == null ? '' : v).trim();
            const dateOrToday = v => parseDateAny(v) || today;
            const hasVal = v => S(v) !== '';
            rows.forEach(r => {
                if (kind === 'financas') {
                    const desc = S(rowGet(r, 'descricao', 'desc'));
                    const amount = Math.abs(parseAmount(rowGet(r, 'valor')));
                    if (!desc || !(amount > 0)) { skipped++; return; }
                    const tk = normKey(rowGet(r, 'tipo'));
                    const type = tk.startsWith('rec') ? 'receita' : tk.startsWith('transf') ? 'transferencia' : 'despesa';
                    const status = normKey(rowGet(r, 'status')).startsWith('pend') ? 'pendente' : (type === 'receita' ? 'recebido' : 'pago');

                    const total = Math.round(amount * 100), base = Math.floor(total / n), group = uid();

                        T.push({ id: uid(), type, desc, category, accId, toAccId, amount: (c / 100).toFixed(2), date: addMonthsToDate(date, i), status: i === 0 ? status : 'pendente', installment: { group, n: i + 1, total: n }, attachments: [] });

                    const base = { cardId: card.id, name, date, invoice, category, obs };
                    if (C.entries.some(e => e.cardId === card.id && e.name === name && Number(e.amount) === (n > 1 ? sgn * Math.floor(Math.abs(amount) * 100 / n) / 100 : amount) && e.date === date)) { skipped++; return; }

                    }
                    added++;
                } else if (kind === 'contatos') {

                    if (!name && !phone && !obs) { skipped++; return; }

                    const rk = normKey(rowGet(r, 'periodo', 'recorrencia'));
                    const type = rk.startsWith('diar') ? 'diario' : rk.startsWith('mens') ? 'mensal' : rk.startsWith('anu') ? 'anual' : rk.startsWith('a cada') || rk.startsWith('cada') ? 'cada' : rk.startsWith('dias') || rk.startsWith('seman') ? 'dias' : 'unico';
                    const rec = { type };
                    if (type === 'cada') rec.every = Math.max(1, parseInt(rowGet(r, 'a cada (dias)', 'a cada')) || 1);
                    if (type === 'dias') {
                        const txt = normKey(rowGet(r, 'dias da semana', 'dias'));
                        rec.weekdays = LEM_WD.map((n, i) => txt.includes(normKey(n)) ? i : -1).filter(i => i >= 0);
                        if (!rec.weekdays.length) { rec.type = 'unico'; delete rec.weekdays; }

        function isisTips() {
            const tips = [];
            const R = v => 'R$ ' + money(v);
            const today = localDateStr(), month = today.slice(0, 7);
            const add = (icon, area, text, tone) => tips.push({ icon, area, text, tone: tone || 'info' });

            // Finanças
            const tx = appData.financeiro.transactions;
            const mtx = tx.filter(t => (t.date || '').startsWith(month));
            const rec = mtx.filter(t => t.type === 'receita').reduce((s, t) => s + Number(t.amount), 0);
            const des = mtx.filter(t => t.type === 'despesa').reduce((s, t) => s + Number(t.amount), 0);
            if (!tx.length) add('fa-wallet', 'Finanças', 'Ainda não há lançamentos. Registre receitas e despesas do mês para eu conseguir analisar para onde o dinheiro vai.');
            else if (!mtx.length) add('fa-wallet', 'Finanças', 'Nenhum lançamento neste mês até agora. Manter o registro em dia é a base de qualquer planejamento.');
            else {
                if (des > rec) add('fa-triangle-exclamation', 'Finanças', `Neste mês as despesas (${R(des)}) passam das receitas (${R(rec)}). Vale rever os maiores gastos e adiar o que não for essencial.`, 'warn');
                else if (rec > 0 && des / rec > 0.8) add('fa-triangle-exclamation', 'Finanças', `Os gastos já consomem ${Math.round(des / rec * 100)}% da receita do mês. Uma referência comum é 50% necessidades, 30% desejos e 20% reserva/objetivos.`, 'warn');
                else if (rec > 0) add('fa-circle-check', 'Finanças', `Sobraram ${R(rec - des)} neste mês. Que tal separar uma parte para a reserva de emergência ou para o fundo da casa?`, 'good');
                const cat = {};
                mtx.filter(t => t.type === 'despesa').forEach(t => { cat[t.category] = (cat[t.category] || 0) + Number(t.amount); });
                const top = Object.entries(cat).sort((a, b) => b[1] - a[1])[0];
                if (top) add('fa-chart-pie', 'Finanças', `Maior categoria de gasto no mês: ${esc(top[0])} (${R(top[1])}). É um bom ponto para buscar economia.`);
            }
            const pend = tx.filter(t => t.type === 'despesa' && t.status === 'pendente');
            if (pend.length) add('fa-hourglass-half', 'Finanças', `${pend.length} despesa(s) pendente(s) somando ${R(pend.reduce((s, t) => s + Number(t.amount), 0))}. Priorize as que têm vencimento mais próximo para evitar juros e multas.`, 'warn');

            // Saúde
            const goal = Number(appData.saude.waterGoal || 3000), w = getWater(today);
            if (w < goal) add('fa-droplet', 'Saúde', `Água hoje: ${w} ml de ${goal} ml. Faltam ${goal - w} ml, que tal um copo agora?`, w < goal / 2 ? 'warn' : 'info');
            else add('fa-droplet', 'Saúde', 'Meta de água de hoje batida. Parabéns!', 'good');
            const taken = (appData.saude.medLog[today] || []);
            const missing = appData.saude.meds.filter(m => medNeedsReminder(m, today) && !taken.includes(m.id));
            if (missing.length) add('fa-pills', 'Saúde', `Remédio(s) ainda não marcado(s) hoje: ${missing.map(m => esc(m.name) + ' (' + esc(m.time) + ')').join(', ')}.`, 'warn');

            // Agenda / lembretes
            const late = appData.lembretes.filter(l => !l.completed && l.date && l.date < today);
            if (late.length) add('fa-bell', 'Lembretes', `${late.length} lembrete(s) atrasado(s). Resolva ou reagende para não acumular.`, 'warn');
            const ag = appData.agenda.filter(a => a.status !== 'Finalizado' && agOcc(a, today));
            if (ag.length) add('fa-calendar-day', 'Agenda', `Você tem ${ag.length} compromisso(s) hoje.`);
            return tips;
        }

        function nB64(buf) { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }

        // ---------- Agenda: repetição, dia todo e calendário ----------
        function agOcc(it, ds) {
            if (!it.date || ds < it.date) return false;
            if (it.until && ds > it.until) return false;
            const r = it.repeat;
            if (!r || !r.freq || r.freq === 'none') return ds === it.date;
            const a = new Date(it.date + 'T00:00:00'), b = new Date(ds + 'T00:00:00');
            const days = Math.round((b - a) / 864e5);
            let n = 1, unit = r.freq;
            if (r.freq === 'custom') { n = Math.max(1, Number(r.every) || 1); unit = r.unit || 'day'; }
            if (unit === 'daily' || unit === 'day') return days % n === 0;
            if (unit === 'weekly' || unit === 'week') {
                const wd = (r.days && r.days.length) ? r.days : [a.getDay()];
                return wd.includes(b.getDay()) && Math.floor((days + a.getDay()) / 7) % n === 0;
            }
            if (unit === 'monthly' || unit === 'month') {
                const mo = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
                const lastB = new Date(b.getFullYear(), b.getMonth() + 1, 0).getDate();
                return mo % n === 0 && b.getDate() === Math.min(a.getDate(), lastB);
            }
            if (unit === 'yearly' || unit === 'year') {
                const yr = b.getFullYear() - a.getFullYear();
                return yr % n === 0 && b.getMonth() === a.getMonth() && b.getDate() === a.getDate();
            }
            return ds === it.date;
        }

            p = String(p || '').trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(p)) return p;
            const m = p.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
        }
        function carePrazoLabel(p) { const d = /^\d{4}-\d{2}-\d{2}$/.test(String(p || '').trim()) ? fmtBR(p) : p; return esc(d); }
        function openCareModal(id = null, modoDef = 'ativo') {
            const it = id ? (careData().items.find(x => x.id === id) || {}) : {};
            const modo = it.modo || modoDef, freq = it.freq || 'diario', turno = it.turno || 'qualquer';
            const o = (v, l, cur) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`;
            const prazoTxt = /^\d{4}-\d{2}-\d{2}$/.test(String(it.prazo || '')) ? fmtBR(it.prazo) : (it.prazo || '');
            showModal(id ? 'Editar' : (modo === 'desejo' ? 'Nova meta' : 'Nova rotina'), `
                <form onsubmit="saveCare(event,'${id || ''}')" class="space-y-4">
                    <div><label class="${LBL}">Descrição *</label><input type="text" id="care-desc" required value="${esc(it.desc || '')}" placeholder="Ex.: Passar creme" class="${INP}"></div>
                    <div><label class="${LBL}">Tipo</label><input type="text" id="care-tipo" list="care-tipos" value="${esc(it.tipo || '')}" placeholder="Ex.: Cuidados com a pele" class="${INP}"><datalist id="care-tipos"><option value="Cuidados com a pele"><option value="Cabelo"><option value="Corpo"><option value="Unhas"><option value="Mente e emoções"><option value="Descanso"><option value="Exercício"><option value="Alimentação"><option value="Beleza"><option value="Lazer"></datalist></div>
                    <div id="care-routine-wrap" class="${modo === 'desejo' ? 'hidden' : ''} space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="${LBL}">Período</label><select id="care-freq" onchange="careFreqChange()" class="${INP}">${o('diario', 'Todos os dias', freq)}${o('dias', 'Dias da semana', freq)}${o('mensal', 'Uma vez por mês', freq)}</select></div>
                            <div><label class="${LBL}">Horário</label><select id="care-turno" class="${INP}">${Object.keys(CARE_TURNOS).map(k => o(k, CARE_TURNOS[k], turno)).join('')}</select></div>
                        </div>
                        <div id="care-days-wrap" class="${freq === 'dias' ? '' : 'hidden'} flex flex-wrap gap-3">${CARE_DIAS.map((d, i) => `<label class="flex flex-col items-center text-[11px] text-slate-500 gap-0.5"><input type="checkbox" class="care-day" value="${i}" ${(it.days || []).includes(i) ? 'checked' : ''}>${d}</label>`).join('')}</div>
                        <div id="care-month-wrap" class="${freq === 'mensal' ? '' : 'hidden'}"><label class="${LBL}">Dia do mês</label><input type="number" min="1" max="31" id="care-mday" value="${it.monthDay || ''}" class="${INP}"></div>
                    </div>
                    <div><label class="${LBL}">Observação</label><input type="text" id="care-obs" value="${esc(it.obs || '')}" placeholder="Ex.: Natura" class="${INP}"></div>
                    <div><label class="${LBL}">Modo</label><select id="care-modo" onchange="careModoChange()" class="${INP}">${o('ativo', 'Ativo: já posso realizar', modo)}${o('desejo', 'Desejo: quero realizar um dia', modo)}</select></div>
                    <div id="care-desejo-wrap" class="${modo === 'desejo' ? '' : 'hidden'} space-y-4">
                        <div><label class="${LBL}">Período (opcional)</label><select id="care-mper" class="${INP}">${o('', 'Sem período', it.mper || '')}${o('semestral', 'Semestral', it.mper || '')}${o('anual', 'Anual', it.mper || '')}${o('unico', 'Único', it.mper || '')}</select></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="${LBL}">Orçamento (opcional)</label><input type="number" step="0.01" min="0" id="care-orc" value="${it.orc != null ? it.orc : ''}" class="${INP}"></div>
                            <div><label class="${LBL}">Prazo (opcional)</label><input type="text" id="care-prazo" value="${esc(prazoTxt)}" placeholder="Ex.: 3 meses" class="${INP}"></div>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold text-sm shadow">Salvar</button>
                </form>`);
        }
        function careFreqChange() {
            const f = document.getElementById('care-freq').value;
            document.getElementById('care-days-wrap').classList.toggle('hidden', f !== 'dias');
            document.getElementById('care-month-wrap').classList.toggle('hidden', f !== 'mensal');
        }
        function careModoChange() {
            const d = document.getElementById('care-modo').value === 'desejo';
            document.getElementById('care-desejo-wrap').classList.toggle('hidden', !d);
            document.getElementById('care-routine-wrap').classList.toggle('hidden', d);
        }
        function saveCare(e, id) {
            e.preventDefault();
            const g = k => document.getElementById(k).value;
            const modo = g('care-modo');
            const data = { desc: g('care-desc').trim(), tipo: g('care-tipo').trim(), freq: g('care-freq'), turno: g('care-turno'), obs: g('care-obs').trim(), modo,
                days: Array.from(document.querySelectorAll('.care-day:checked')).map(c => Number(c.value)), monthDay: g('care-mday'),
                mper: modo === 'desejo' ? g('care-mper') : '', orc: modo === 'desejo' ? g('care-orc') : '', prazo: modo === 'desejo' ? g('care-prazo').trim() : '' };
            const C = careData();
            if (id) Object.assign(C.items.find(x => x.id === id), data); else C.items.push(Object.assign({ id: uid(), done: false }, data));
            careTab = modo === 'desejo' ? 'metas' : 'rotinas';
            saveAppData(); closeModal(); renderCurrentTabContent(); showToast('Salvo!', 'success');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = "bg-emerald-600 text-white";
            if (type === 'error') bgClass = "bg-rose-600 text-white";
            if (type === 'warning') bgClass = "bg-amber-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl text-xs font-bold flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.onload = async function() {
            loadAppData();
            applyColors(getColors());
            if (appData.profile.theme === 'dark') document.documentElement.classList.add('dark');
            switchTab('dashboard');
            calcInit();
            await initBackupFolder();
            const _filled = !/COLE_AQUI/.test(SUPABASE_URL + SUPABASE_ANON_KEY);
            if (_filled && !window.supabase) await sbLoadLib(); // biblioteca não carregou: tenta outra fonte
            if (_filled && !window.supabase) { showLoginGate(true, 'Não foi possível carregar o serviço de login. Verifique a internet (ou desative bloqueadores de anúncio) e recarregue a página.'); return; }
            if (!sbInit()) ensureProfileName(); // sem nuvem configurada: modo local
            // com nuvem: o nome é pedido logo após o login
        };
    </script>
<script>if(window.innerWidth<768){var _sb=document.getElementById('sidebar');if(_sb)_sb.classList.add('-translate-x-full');}</script>
<script>(function(){var c=window.closeModal;if(typeof c==='function'){window.closeModal=function(){nEd={};return c.apply(this,arguments);};}})();</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
